# Local observability stack: your app + Prometheus + Grafana.
# Run from this folder:  docker compose up --build
#   App:        http://localhost:8080
#   Prometheus: http://localhost:9090   (Status -> Targets should show UP)
#   Grafana:    http://localhost:3000   (no login; dashboard "Product API - RED" is pre-loaded)
services:
  product-service:
    build: ../src
    ports:
      - "8080:8080"
    environment:
      ENABLE_FAULT_INJECTION: "true"
      SEED_PRODUCTS: "100"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - product-service

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
