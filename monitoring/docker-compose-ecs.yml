# Prometheus + Grafana on your Mac, watching the copies running on ECS.
# Run from the monitoring/ folder:  docker compose -f docker-compose-ecs.yml up
#   Prometheus: http://localhost:9090/targets   (one row per ECS task, should be UP)
#   Grafana:    http://localhost:3000           (HW5 RED dashboard + "HW6 - Scaling" dashboard)
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus-ecs.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
